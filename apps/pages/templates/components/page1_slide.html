{% load static %}
<section class="menu-categorias">
  <!-- Linha 1 -->
  <div class="categoria pequena">
    <a href="#">
      <img src="{% static 'images/fundoOmnilife.jpg' %}" alt="Omnilife">
      <span>OMNILIFE</span>
    </a>
  </div>

  <div class="categoria grande">
    <a href="#">
      <img src="{% static 'images/fundoEletrofitness.jpg' %}" alt="EletroFitness">
      <span>ELETROFITNESS</span>
    </a>
  </div>

  <!-- Linha 2 -->
  <div class="categoria media">
    <a href="#">
      <img src="{% static 'images/fundoProcedimentos.jpg' %}" alt="Procedimentos">
      <span>PROCEDIMENTOS</span>
    </a>
  </div>

  <div class="categoria media">
    <a href="#">
      <img src="{% static 'images/fundoJaleco.jpg' %}" alt="Jalecos">
      <span>JALECOS</span>
    </a>
  </div>

  <div class="categoria media">
    <a href="#">
      <img src="{% static 'images/fundoMelasma.jpg' %}" alt="Melasma">
      <span>MELASMA</span>
    </a>
  </div>
</section>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {

    background-color: #fff;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .menu-categorias {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: 45vh 45vh;
    gap: 8px;
    width: 100%;
    padding: 10px;
  }

  .categoria {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
  }

  .categoria a {
    display: block;
    width: 100%;
    height: 100%;
  }

  .categoria img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(1.15);
    transition: transform 0.4s ease, filter 0.3s ease;
  }

  .categoria span {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: rgba(255, 255, 255, 0.93);
    color: #000;
    padding: 15px 30px;
    border-radius: 1px;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
  }

  .categoria:hover img {
    transform: scale(1.08);
    filter: brightness(0.5);
  }

  /* ===== Layout Desktop ===== */
  .pequena {
    grid-column: span 2;
    grid-row: 1;
  }

  .grande {
    grid-column: span 4;
    grid-row: 1;
  }

  .media {
    grid-column: span 2;
    grid-row: 2;
  }

  /* ===== Responsivo Tablet ===== */
  @media (max-width: 1024px) {
    .menu-categorias {
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 40vh;
    }

    .pequena,
    .grande,
    .media {
      grid-column: span 1;
      grid-row: auto;
    }
  }

  /* ===== Responsivo Celular ===== */
  @media (max-width: 768px) {
    .menu-categorias {
      grid-template-columns: 1fr;
      grid-auto-rows: 45vh;
    }

    .categoria span {
      font-size: 0.9rem;
      padding: 8px 16px;
    }
  }

  @media (max-width: 480px) {
    .menu-categorias {
      grid-auto-rows: 40vh;
    }

    .categoria span {
      font-size: 0.85rem;
      padding: 6px 14px;
    }
  }
</style>
