{% load static %}
<nav class="navbar navbar-expand-lg position-relative top-0 w-100 px-5" style="height: 120px; z-index: 10;">
    <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap">

        <!-- LOGO -->
        <a class="navbar-brand mx-auto mx-lg-0" href="/">
            <img src="{{ logo.image.url }}" width="350" alt="{{ logo.title }}" title="{{ logo.title }}" class="Logo">
        </a>

        <!-- BOTÕES E INFORMAÇÕES DO USUÁRIO (somente desktop) -->
        <div class="d-flex align-items-center gap-3 navbar-buttons">
            {% if user.is_authenticated %}
                <span class="p-2 d-flex align-items-center" style="color: #28282b; font-weight: 600;">
                    <i class="fas fa-user mx-2"></i>{{ user.first_name }} {{ user.last_name }}
                </span>
                <button class="btn btn-danger mx-1" data-bs-toggle="modal" href="#logoutModal">Logout</button>
                <button type="button" class="btn" style="background-color: #4bbac5; color: #28282b; font-weight: bolder;" onclick="window.location.href='/admin/'">Admin</button>
            {% else %}
                <button class="btn mx-2" id="btn-entrar" style="background-color: #4bbac5; color: #28282b; font-weight: bolder;" onclick="location.href='{% url 'login' %}'">Entrar</button>
            {% endif %}
        </div>
    </div>
</nav>

<style>
/* Impede rolagem lateral */
html, body {
  overflow-x: hidden;
}

/* Garante centralização da logo */
.navbar .navbar-brand img {
  max-width: 350px;
  height: auto;
}

/* ---- Responsividade ---- */

/* Até 991px = esconde todos os botões, mostra só a logo centralizada */
@media (max-width: 991px) {
  .navbar-buttons {
    display: none !important;
  }

  .navbar {
    justify-content: center !important;
  }

  .navbar .navbar-brand {
    margin: 0 auto;
  }

  .navbar .navbar-brand img {
    width: 170px;
  }
}
</style>
